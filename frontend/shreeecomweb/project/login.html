<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f7;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 20px;
    color: #222;
}

.login-box input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-size: 14px;
}

.login-box input:focus {
    outline: none;
    border-color: #2874f0;
}

.login-box button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
}

.login-btn {
    background: #2874f0;
    color: white;
}

.login-btn:hover {
    background: #21ea54;
}

.signup-btn {
    background: #f1f3f6;
    color: #333;
    border: 1px solid #ccc;
}

.signup-btn:hover {
    background: rgb(236, 240, 236);
}

#msg {
    margin-top: 10px;
    color: red;
    font-size: 14px;
}
</style>

</head>
<body>
<div class="login-box">

<h2>Login</h2>
<input id="user" placeholder="Username" required><br><br>
<input id="pass" type="password" placeholder="Password" required><br><br>

<button class="login-btn" onclick="login()">Login</button>
<button class="signup-btn" onclick="register()">Sign Up</button>
<p id="msg"></p>

<script>
function register() {
    const username = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value.trim();
    const msg = document.getElementById("msg");

    
    if (username === "" || password === "") {
        msg.style.color = "red";
        msg.innerText = "Username and Password cannot be empty";
        return; 
    }

    
    fetch("http://localhost:8080/register", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "username=" + user.value + "&password=" + pass.value
    })
    .then(res => res.text())
    .then(alert);
}
</script>
<h2 id="welcome"></h2>
<script>
function login() {
    const username = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value.trim();
    const msg = document.getElementById("msg");

    
    if (username === "" || password === "") {
        msg.style.color = "red";
        msg.innerText = "Username and Password cannot be empty";
        return; 
    }

   fetch("http://localhost:8080/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "username=" + username + "&password=" + password
    })
    
    .then(res => res.text())
    .then(data => {
        if (data.startsWith("SUCCESS")) {
            let username = data.split(":")[1];

            // store username
            localStorage.setItem("username", username);

            // redirect to home page
            window.location.href = "index.html";
        } else {
            document.getElementById("msg").innerText = data;
        }
    })
    .catch(err => {
        document.getElementById("msg").innerText = "Server error";
    });
}
</script>
</div>
</body>
</html>
